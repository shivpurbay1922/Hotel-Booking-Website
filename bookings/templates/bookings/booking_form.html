{% extends "bookings/base.html" %}
{% block content %}
<h2>Make a Booking</h2>

<form method="post">
  {% csrf_token %}
  <fieldset>
    <legend>Guest Details</legend>
    {{ guest_form.as_p }}
  </fieldset>

  <fieldset>
    <legend>Booking</legend>
    {{ booking_form.as_p }}
  </fieldset>

  <button type="submit">Confirm Booking</button>
</form>
{% endblock %}
