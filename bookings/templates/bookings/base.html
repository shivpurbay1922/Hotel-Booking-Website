{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'bookings/styles.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'room_list' %}">🏨 Hotel Booking</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="{% url 'room_list' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'room_availability' %}">Available Rooms</a></li>
        {% if user.is_authenticated %}
          <li class="nav-item"><a class="nav-link text-warning" href="#">Welcome, {{ user.username }}</a></li>
          <li class="nav-item"><a class="nav-link text-danger" href="{% url 'logout' %}">Logout</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link text-success" href="{% url 'login' %}">Login</a></li>
          <li class="nav-item"><a class="nav-link text-info" href="{% url 'signup' %}">Sign Up</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<div class="container my-4">
  {% block content %}{% endblock %}
</div>

<footer class="text-center text-light py-3 bg-dark mt-auto">
  <small>© 2025 Hotel Booking | Designed by Shiv</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
