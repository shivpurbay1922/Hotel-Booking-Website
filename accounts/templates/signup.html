{% extends 'bookings/base.html' %}
{% block content %}
  <h2 class="mb-4">Create Your Account</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-info w-100">Sign Up</button>
  </form>
  <p class="mt-3">Already registered? <a href="{% url 'login' %}" class="text-warning">Login here</a>.</p>
{% endblock %}
